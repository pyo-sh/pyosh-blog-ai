[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dev-pipeline"
version = "0.1.0"
description = "Python implementation of dev-pipeline helpers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dev-pipeline = "dev_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["../tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
