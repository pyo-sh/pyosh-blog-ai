<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pyosh blog Admin - {{PAGE_TITLE}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Gothic A1', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            bg:         { 1: 'var(--background1)', 2: 'var(--background2)', 3: 'var(--background3)', 4: 'var(--background4)' },
            tx:         { 1: 'var(--text1)',        2: 'var(--text2)',       3: 'var(--text3)',       4: 'var(--text4)'       },
            bd:         { 1: 'var(--border1)',      2: 'var(--border2)',     3: 'var(--border3)',     4: 'var(--border4)'     },
            primary:    { 1: 'var(--primary1)',     2: 'var(--primary2)'    },
            secondary:  { 1: 'var(--secondary1)',   2: 'var(--secondary2)'  },
            info:      { 1: 'var(--info1)',    2: 'var(--info2)'   },
            warning:   { 1: 'var(--warning1)',   2: 'var(--warning2)'  },
            positive:   { 1: 'var(--positive1)',    2: 'var(--positive2)'   },
            negative:   { 1: 'var(--negative1)',    2: 'var(--negative2)'   },
            grey:       { 1: 'var(--grey1)',        2: 'var(--grey2)',       3: 'var(--grey3)',       4: 'var(--grey4)'       },
            yellow:     { 1: 'var(--yellow1)',      2: 'var(--yellow2)'     },
            'code-surface': 'var(--code-surface)',
          },
        },
      },
    }
  </script>
  <style>
    /* ═══ Color Tokens ═══ */
    :root {
      --dark-background1:#131415;--dark-background2:#1d1e20;--dark-background3:#26282a;--dark-background4:#303335;
      --dark-text1:#e9eaeb;--dark-text2:#c4c6c9;--dark-text3:#a8adb1;--dark-text4:#919799;
      --dark-border1:#a6abb0;--dark-border2:#a1a5aa;--dark-border3:#54595d;--dark-border4:#3e4245;
      --dark-primary1:#a591e8;--dark-primary2:#c7bbf0;--dark-secondary1:#8c72c5;--dark-secondary2:#b9aadc;
      --dark-info1:#a5b2ff;--dark-info2:#c7d0ff;
      --dark-warning1:#f0a030;--dark-warning2:#3d2e18;
      --dark-positive1:#10c67d;--dark-positive2:#78e2b8;--dark-negative1:#f15966;--dark-negative2:#feccd0;
      --dark-grey1:#484c50;--dark-grey2:#797f85;--dark-grey3:#aeb2b6;--dark-grey4:#dee0e1;
      --dark-yellow1:#ffbb32;--dark-yellow2:#ffd470;
      --light-background1:#f9f9fa;--light-background2:#f1f2f3;--light-background3:#e6e8e9;--light-background4:#dbdde0;
      --light-text1:#232629;--light-text2:#4b5158;--light-text3:#6b7780;--light-text4:#a3aab1;
      --light-border1:#33383c;--light-border2:#a6adb3;--light-border3:#dbdde0;--light-border4:#eaebed;
      --light-primary1:#8a6fe0;--light-primary2:#b09ee9;--light-secondary1:#6b49b5;--light-secondary2:#9983cc;
      --light-info1:#8d9eff;--light-info2:#b0bcff;
      --light-warning1:#c67a0a;--light-warning2:#fef3e0;
      --light-positive1:#078556;--light-positive2:#41d69b;--light-negative1:#e21223;--light-negative2:#f15966;
      --light-grey1:#f1f2f3;--light-grey2:#c7ccd0;--light-grey3:#9099a1;--light-grey4:#596068;
      --light-yellow1:#f2a116;--light-yellow2:#ffbe3d;
      --code-surface:#0d1117;
    }
    body{
      --background1:var(--light-background1);--background2:var(--light-background2);--background3:var(--light-background3);--background4:var(--light-background4);
      --text1:var(--light-text1);--text2:var(--light-text2);--text3:var(--light-text3);--text4:var(--light-text4);
      --border1:var(--light-border1);--border2:var(--light-border2);--border3:var(--light-border3);--border4:var(--light-border4);
      --primary1:var(--light-primary1);--primary2:var(--light-primary2);--secondary1:var(--light-secondary1);--secondary2:var(--light-secondary2);
      --info1:var(--light-info1);--info2:var(--light-info2);
      --warning1:var(--light-warning1);--warning2:var(--light-warning2);
      --positive1:var(--light-positive1);--positive2:var(--light-positive2);--negative1:var(--light-negative1);--negative2:var(--light-negative2);
      --grey1:var(--light-grey1);--grey2:var(--light-grey2);--grey3:var(--light-grey3);--grey4:var(--light-grey4);
      --yellow1:var(--light-yellow1);--yellow2:var(--light-yellow2);
      color:var(--text1);background-color:var(--background1);transition:color .25s,background-color .4s;
    }
    @media(prefers-color-scheme:dark){body:not([data-theme="light"]){
      --background1:var(--dark-background1);--background2:var(--dark-background2);--background3:var(--dark-background3);--background4:var(--dark-background4);
      --text1:var(--dark-text1);--text2:var(--dark-text2);--text3:var(--dark-text3);--text4:var(--dark-text4);
      --border1:var(--dark-border1);--border2:var(--dark-border2);--border3:var(--dark-border3);--border4:var(--dark-border4);
      --primary1:var(--dark-primary1);--primary2:var(--dark-primary2);--secondary1:var(--dark-secondary1);--secondary2:var(--dark-secondary2);
      --info1:var(--dark-info1);--info2:var(--dark-info2);
      --warning1:var(--dark-warning1);--warning2:var(--dark-warning2);
      --positive1:var(--dark-positive1);--positive2:var(--dark-positive2);--negative1:var(--dark-negative1);--negative2:var(--dark-negative2);
      --grey1:var(--dark-grey1);--grey2:var(--dark-grey2);--grey3:var(--dark-grey3);--grey4:var(--dark-grey4);
      --yellow1:var(--dark-yellow1);--yellow2:var(--dark-yellow2);
    }}
    body[data-theme="dark"]{
      --background1:var(--dark-background1);--background2:var(--dark-background2);--background3:var(--dark-background3);--background4:var(--dark-background4);
      --text1:var(--dark-text1);--text2:var(--dark-text2);--text3:var(--dark-text3);--text4:var(--dark-text4);
      --border1:var(--dark-border1);--border2:var(--dark-border2);--border3:var(--dark-border3);--border4:var(--dark-border4);
      --primary1:var(--dark-primary1);--primary2:var(--dark-primary2);--secondary1:var(--dark-secondary1);--secondary2:var(--dark-secondary2);
      --info1:var(--dark-info1);--info2:var(--dark-info2);
      --warning1:var(--dark-warning1);--warning2:var(--dark-warning2);
      --positive1:var(--dark-positive1);--positive2:var(--dark-positive2);--negative1:var(--dark-negative1);--negative2:var(--dark-negative2);
      --grey1:var(--dark-grey1);--grey2:var(--dark-grey2);--grey3:var(--dark-grey3);--grey4:var(--dark-grey4);
      --yellow1:var(--dark-yellow1);--yellow2:var(--dark-yellow2);
    }
    body[data-theme="light"]{
      --background1:var(--light-background1);--background2:var(--light-background2);--background3:var(--light-background3);--background4:var(--light-background4);
      --text1:var(--light-text1);--text2:var(--light-text2);--text3:var(--light-text3);--text4:var(--light-text4);
      --border1:var(--light-border1);--border2:var(--light-border2);--border3:var(--light-border3);--border4:var(--light-border4);
      --primary1:var(--light-primary1);--primary2:var(--light-primary2);--secondary1:var(--light-secondary1);--secondary2:var(--light-secondary2);
      --info1:var(--light-info1);--info2:var(--light-info2);
      --warning1:var(--light-warning1);--warning2:var(--light-warning2);
      --positive1:var(--light-positive1);--positive2:var(--light-positive2);--negative1:var(--light-negative1);--negative2:var(--light-negative2);
      --grey1:var(--light-grey1);--grey2:var(--light-grey2);--grey3:var(--light-grey3);--grey4:var(--light-grey4);
      --yellow1:var(--light-yellow1);--yellow2:var(--light-yellow2);
    }

    /* ═══ Noise Overlay ═══ */
    body::after{content:'';position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.025;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat:repeat;background-size:256px 256px;}

    /* ═══ Animations ═══ */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(1.5rem)}to{opacity:1;transform:translateY(0)}}
    .reveal{opacity:0;animation:fadeInUp .6s cubic-bezier(.16,1,.3,1) forwards}
    .reveal-stagger{opacity:0}
    .reveal-stagger.visible{animation:fadeInUp .5s cubic-bezier(.16,1,.3,1) forwards}

    /* ═══ Typography ═══ */
    h1{font-size:1.875rem;line-height:2.375rem;font-weight:700}
    h2{font-size:1.625rem;line-height:2.063rem;font-weight:700}
    h3{font-size:1.375rem;line-height:1.75rem;font-weight:700}
    h4{font-size:1.25rem;line-height:1.625rem;font-weight:700}
    h5{font-size:1.063rem;line-height:1.375rem;font-weight:700}
    h6{font-size:0.938rem;line-height:1.25rem;font-weight:700}
    .text-body-xl{font-size:1.688rem;line-height:2.125rem;font-weight:400}
    .text-body-lg{font-size:1.5rem;line-height:1.938rem;font-weight:400}
    .text-body-md{font-size:1.313rem;line-height:1.688rem;font-weight:400}
    .text-body-base{font-size:1.125rem;line-height:1.5rem;font-weight:400}
    .text-body-sm{font-size:0.875rem;line-height:1.188rem;font-weight:400}
    .text-body-xs{font-size:0.688rem;line-height:1rem;font-weight:400}
    .text-ui-base{font-size:1rem;line-height:1.5rem;font-weight:400}
    .text-ui-sm{font-size:0.813rem;line-height:1.125rem;font-weight:400}
    .text-ui-xs{font-size:0.75rem;line-height:1rem;font-weight:400}

    /* ═══ Scrollbar ═══ */
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--background2)}
    ::-webkit-scrollbar-thumb{background:var(--border3);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--border2)}

    /* ═══ Utility ═══ */
    .break-keep{word-break:keep-all;overflow-wrap:break-word}
    .line-clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    /* ═══ Admin Sidebar ═══ */
    .admin-sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:30;
      width:240px;display:flex;flex-direction:column;
      background:var(--background2);border-right:1px solid var(--border3);
      transition:width .3s cubic-bezier(.16,1,.3,1);
    }
    .admin-sidebar.collapsed{width:64px;}
    .admin-sidebar.collapsed .nav-label,
    .admin-sidebar.collapsed .sidebar-text{opacity:0;width:0;overflow:hidden;white-space:nowrap;}
    .admin-sidebar.collapsed .admin-nav-item{justify-content:center;padding:8px 0;}
    .admin-sidebar.collapsed .sidebar-logo-area .admin-badge{display:none;}
    .admin-sidebar.collapsed~#sidebarOverlay~#contentWrapper{margin-left:64px!important;}

    .admin-nav-item{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;border-radius:8px;
      font-size:14px;color:var(--text2);text-decoration:none;
      transition:all .15s ease;
    }
    .admin-nav-item:hover{background:var(--background3);}
    .admin-nav-item.active{
      background:rgba(138,111,224,0.10);
      color:var(--primary1);font-weight:500;
    }
    .nav-label{white-space:nowrap;overflow:hidden;transition:opacity .2s;}
    .admin-nav-item iconify-icon{display:flex;flex-shrink:0;align-items:center;}
    iconify-icon{display:inline-block;vertical-align:middle;}

    .admin-content{
      margin-left:240px;
      transition:margin-left .3s cubic-bezier(.16,1,.3,1);
    }
    .admin-topbar{
      position:sticky;top:0;z-index:10;
      display:flex;align-items:center;height:56px;padding:0 24px;gap:16px;
      background:rgba(249,249,250,0.80);
      backdrop-filter:blur(16px) saturate(1.4);
      -webkit-backdrop-filter:blur(16px) saturate(1.4);
      border-bottom:1px solid var(--border4);
    }
    body[data-theme="dark"] .admin-topbar{background:rgba(19,20,21,0.85);}
    @media(prefers-color-scheme:dark){body:not([data-theme="light"]) .admin-topbar{background:rgba(19,20,21,0.85);}}

    @media(max-width:767px){
      .admin-sidebar{transform:translateX(-100%);width:240px!important;}
      .admin-sidebar.mobile-open{transform:translateX(0);}
      .admin-content{margin-left:0!important;}
    }

    /* ═══ Admin Components ═══ */

    /* Form */
    .admin-input{
      width:100%;padding:8px 12px;border-radius:8px;font-size:14px;
      background:var(--background1);border:1px solid var(--border3);
      color:var(--text1);outline:none;transition:border-color .2s,box-shadow .2s;
    }
    .admin-input:focus{border-color:var(--primary1);box-shadow:0 0 0 3px rgba(138,111,224,0.12);}
    .admin-input::placeholder{color:var(--text4);}

    .admin-select{
      padding:8px 32px 8px 12px;border-radius:8px;font-size:14px;
      background:var(--background1);border:1px solid var(--border3);
      color:var(--text1);outline:none;cursor:pointer;appearance:none;
      background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23838c95' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat:no-repeat;background-position:right 10px center;
      transition:border-color .2s;
    }
    .admin-select:focus{border-color:var(--primary1);}

    .admin-textarea{
      width:100%;padding:10px 12px;border-radius:8px;font-size:14px;
      background:var(--background1);border:1px solid var(--border3);
      color:var(--text1);outline:none;resize:vertical;min-height:80px;
      transition:border-color .2s,box-shadow .2s;
    }
    .admin-textarea:focus{border-color:var(--primary1);box-shadow:0 0 0 3px rgba(138,111,224,0.12);}

    .admin-checkbox{
      width:16px;height:16px;border-radius:4px;cursor:pointer;
      accent-color:var(--primary1);
    }

    /* Buttons */
    .btn-primary{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;
      background:var(--primary1);color:#fff;border:none;cursor:pointer;
      transition:opacity .2s,transform .15s;
    }
    .btn-primary:hover{opacity:.9;}.btn-primary:active{transform:scale(.97);}

    .btn-secondary{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;
      background:transparent;color:var(--text2);border:1px solid var(--border3);cursor:pointer;
      transition:background .2s,transform .15s;
    }
    .btn-secondary:hover{background:var(--background3);}.btn-secondary:active{transform:scale(.97);}

    .btn-danger{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;
      background:var(--negative1);color:#fff;border:none;cursor:pointer;
      transition:opacity .2s,transform .15s;
    }
    .btn-danger:hover{opacity:.9;}

    .btn-ghost{
      display:inline-flex;align-items:center;justify-content:center;gap:4px;
      padding:6px 10px;border-radius:6px;font-size:13px;
      background:transparent;color:var(--text3);border:none;cursor:pointer;
      transition:background .15s,color .15s;
    }
    .btn-ghost:hover{background:var(--background3);color:var(--text2);}

    /* Badges */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;}
    .badge-published{background:rgba(13,169,107,0.12);color:var(--positive1);}
    .badge-draft{background:rgba(144,153,161,0.12);color:var(--grey3);}
    .badge-archived{background:rgba(255,190,61,0.12);color:var(--yellow1);}
    .badge-deleted{background:rgba(226,18,35,0.12);color:var(--negative1);}
    .badge-private{background:rgba(107,73,181,0.12);color:var(--secondary1);}
    .badge-public{background:rgba(138,111,224,0.12);color:var(--primary1);}
    .badge-category{background:rgba(138,111,224,0.12);color:var(--primary1);}

    /* Table */
    .admin-table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;}
    .admin-table th{
      padding:10px 12px;text-align:left;font-weight:600;font-size:12px;
      color:var(--text3);background:var(--background2);
      border-bottom:1px solid var(--border3);white-space:nowrap;
    }
    .admin-table td{
      padding:12px;color:var(--text2);
      border-bottom:1px solid var(--border4);vertical-align:middle;
    }
    .admin-table tbody tr{transition:background .15s;}
    .admin-table tbody tr:hover{background:var(--background2);}

    /* Card */
    .admin-card{
      background:var(--background2);border:1px solid var(--border4);
      border-radius:12px;padding:20px;transition:border-color .2s;
    }
    .admin-card:hover{border-color:var(--border3);}

    /* Stat Card */
    .stat-card{
      background:var(--background2);border:1px solid var(--border4);
      border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px;
      transition:border-color .2s,transform .2s;
    }
    .stat-card:hover{border-color:var(--border3);transform:translateY(-2px);}
    .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
    .stat-value{font-family:'Outfit','Gothic A1',sans-serif;font-size:1.75rem;font-weight:700;color:var(--text1);letter-spacing:-.02em;line-height:1;}
    .stat-label{font-size:13px;color:var(--text3);}

    /* Pagination */
    .page-btn{
      width:36px;height:36px;border-radius:8px;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:500;color:var(--text2);
      background:transparent;border:none;cursor:pointer;
      transition:all .25s cubic-bezier(.16,1,.3,1);
    }
    .page-btn:hover:not(:disabled):not(.active){transform:scale(1.08);background:var(--background3);}
    .page-btn:active:not(:disabled){transform:scale(.95);}
    .page-btn.active{background:var(--primary1);color:#fff;font-weight:700;}
    .page-btn:disabled{opacity:.3;cursor:not-allowed;}

    /* Modal */
    .modal-overlay{
      position:fixed;inset:0;z-index:50;
      background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
      display:none;align-items:center;justify-content:center;padding:16px;
    }
    .modal-overlay.open{display:flex;}
    .modal-content{
      background:var(--background1);border:1px solid var(--border3);
      border-radius:16px;padding:24px;width:100%;
      max-height:90vh;overflow-y:auto;
      animation:fadeInUp .3s cubic-bezier(.16,1,.3,1);
    }

    /* Toggle Switch */
    .toggle-switch{
      position:relative;width:44px;height:24px;
      background:var(--border3);border-radius:12px;cursor:pointer;
      transition:background .2s;
    }
    .toggle-switch.active{background:var(--primary1);}
    .toggle-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#ffffff;transition:transform .2s cubic-bezier(.16,1,.3,.1);}.toggle-switch-sm .toggle-knob{width:16px;height:16px;border-radius:8px;}.toggle-switch.active .toggle-knob{transform:translateX(20px);}.toggle-switch-sm.active .toggle-knob{transform:translateX(16px);}
    
    

    /* Dropzone */
    .dropzone{
      border:2px dashed var(--border3);border-radius:12px;
      padding:40px 24px;text-align:center;
      transition:border-color .2s,background .2s;cursor:pointer;
    }
    .dropzone:hover,.dropzone.dragover{
      border-color:var(--primary1);
      background:rgba(138,111,224,0.04);
    }

    /* Tab */
    .admin-tab{
      padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;
      color:var(--text3);background:transparent;border:none;cursor:pointer;
      transition:all .2s;
    }
    .admin-tab:hover{color:var(--text2);}
    .admin-tab.active{background:rgba(138,111,224,0.10);color:var(--primary1);}

    /* ═══ Page-Specific Styles ═══ */
    /* {{PAGE_STYLES}} */
  </style>
</head>
<body class="min-h-[100dvh] antialiased">

  <!-- ═══ Admin Sidebar ═══ -->

  <!-- ═══ Scripts ═══ -->
  <script>
    // ─── Theme Toggle ───
    function getPreferredTheme(){
      const stored=localStorage.getItem('theme');
      if(stored) return stored;
      return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    }
    function applyTheme(theme){
      document.body.setAttribute('data-theme',theme);
      localStorage.setItem('theme',theme);
      document.getElementById('sunIcon').style.display=theme==='dark'?'none':'';
      document.getElementById('moonIcon').style.display=theme==='dark'?'':'none';
    }
    function toggleTheme(){
      applyTheme((document.body.getAttribute('data-theme')||'light')==='dark'?'light':'dark');
    }
    applyTheme(getPreferredTheme());

    // ─── Sidebar ───
    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');}
    function openMobileSidebar(){
      document.getElementById('sidebar').classList.add('mobile-open');
      document.getElementById('sidebarOverlay').classList.remove('hidden');
      document.body.style.overflow='hidden';
    }
    function closeMobileSidebar(){
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('sidebarOverlay').classList.add('hidden');
      document.body.style.overflow='';
    }
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&document.getElementById('sidebar').classList.contains('mobile-open'))closeMobileSidebar();
    });

    // ─── Active Nav ───
    document.querySelectorAll('.admin-nav-item[data-page]').forEach(el=>{
      if(el.dataset.page==='{{ACTIVE_PAGE}}') el.classList.add('active');
    });

    // ─── Staggered Reveal ───
    const revealObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){entry.target.classList.add('visible');revealObserver.unobserve(entry.target);}
      });
    },{threshold:0.08,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.reveal-stagger').forEach((el,i)=>{
      el.style.animationDelay=`${i*80}ms`;
      revealObserver.observe(el);
    });

    // ─── Pagination (demo) ───
    document.querySelectorAll('.page-btn:not(:disabled)').forEach(btn=>{
      btn.addEventListener('click',function(){
        if(this.classList.contains('active'))return;
        document.querySelectorAll('.page-btn.active').forEach(a=>{
          a.classList.remove('active');a.style.background='transparent';a.style.color='var(--text2)';a.style.fontWeight='500';
        });
        this.classList.add('active');this.style.background='var(--primary1)';this.style.color='var(--background1)';this.style.fontWeight='700';
      });
    });

    // ─── Modal ───
    function openModal(id){document.getElementById(id).classList.add('open');}
    function closeModal(id){document.getElementById(id).classList.remove('open');}

    // ─── Toggle Switch ───
    document.querySelectorAll('.toggle-switch').forEach(el=>{
      el.addEventListener('click',()=>el.classList.toggle('active'));
    });

    /* {{PAGE_SCRIPTS}} */
  </script>
